name: Staging QA (Playwright)

# Closes the FS-96 structural gap: nothing was re-running the qa/
# Playwright suite against staging after a deploy, so a real regression
# (the CSP headers-worker change, 23 Aug) sat undetected for 4+ days
# until a manual audit happened to catch it.
#
# Triggered off "Deploy Staging" completing, not the raw push, so this
# only runs once the push-to-external-repo step has actually finished -
# same reasoning as purge-cache.yml's workflow_run choice on main.
#
# IMPORTANT CAVEAT this workflow itself exists to catch: "Deploy Staging"
# succeeding only means the push to the fieldnote-security-staging repo
# succeeded - it does NOT mean GitHub Pages' own build of that content
# succeeded (these are separate, decoupled steps; discovered the hard
# way during the FS-96 fix on 2026-08-29, when the Pages build failed
# silently while the deploy workflow reported success). Step 2 below
# polls that repo's own Pages build status directly so this workflow
# fails loudly on exactly that failure mode instead of testing stale
# content and passing green.
#
# One-time manual setup required (cannot be done from a workflow file):
# add a secret named QA_REPO_TOKEN - a fine-grained GitHub PAT, read-only,
# scoped to just the hoongkiet-web/fieldnote-security-scanner repo (where
# qa/ actually lives) and to hoongkiet-web/fieldnote-security-staging
# (read-only, for the Pages-build-status poll in step 2). Without this
# secret, step 2 and step 3 below will fail with a 401/403 - that's
# expected until the secret is added, not a bug in this file.

on:
  workflow_run:
    workflows: ["Deploy Staging"]
    types: [completed]

permissions:
  contents: read

jobs:
  qa:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to actually build the new content
        env:
          GH_TOKEN: ${{ secrets.QA_REPO_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            build=$(gh api repos/hoongkiet-web/fieldnote-security-staging/pages/builds/latest)
            status=$(echo "$build" | jq -r '.status')
            echo "Pages build status: $status (attempt $i/12)"
            if [ "$status" = "built" ]; then
              echo "Pages build succeeded."
              exit 0
            fi
            if [ "$status" = "errored" ]; then
              echo "::error::GitHub Pages build for fieldnote-security-staging FAILED: $(echo "$build" | jq -r '.error.message'). The 'Deploy Staging' Action succeeded (content was pushed) but Pages itself never built it - staging is serving stale content. This is the exact failure mode this workflow exists to catch."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for a Pages build result after 2 minutes."
          exit 1

      - name: Checkout the qa/ Playwright suite
        uses: actions/checkout@v4
        with:
          repository: hoongkiet-web/fieldnote-security-scanner
          token: ${{ secrets.QA_REPO_TOKEN }}
          sparse-checkout: |
            qa
          path: scanner-repo

      - name: Install dependencies
        working-directory: scanner-repo/qa
        run: npm ci

      - name: Install Playwright's chromium browser only
        working-directory: scanner-repo/qa
        run: npx playwright install --with-deps chromium

      - name: Run the cross-browser suite against the live staging site
        working-directory: scanner-repo/qa
        env:
          QA_BASE_URL: https://staging.fieldnotesecurity.com
        run: npx playwright test cross-browser.spec.js --project=chromium

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: scanner-repo/qa/test-results/
          retention-days: 7
